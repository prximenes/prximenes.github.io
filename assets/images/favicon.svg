<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Gradiente Dark Mode -->
    <linearGradient id="pGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="xGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f87171" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>

    <!-- Gradiente Light Mode -->
    <linearGradient id="pGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#003366" />
      <stop offset="100%" stop-color="#1e40af" />
    </linearGradient>
    <linearGradient id="xGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e53935" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .bg {
      fill: #090e1a;
      stroke: rgba(56, 189, 248, 0.25);
      stroke-width: 1.5;
      rx: 14px;
    }
    .p-path {
      stroke: url(#pGradDark);
      fill: none;
      stroke-width: 5.5;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .x-path-1 {
      stroke: url(#xGradDark);
      fill: none;
      stroke-width: 5.5;
      stroke-linecap: round;
    }
    .x-path-2 {
      stroke: url(#xGradDark);
      fill: none;
      stroke-width: 5.5;
      stroke-linecap: round;
    }
    .node-dot {
      fill: #38bdf8;
    }

    @media (prefers-color-scheme: light) {
      .bg {
        fill: #f8fafc;
        stroke: rgba(0, 51, 102, 0.2);
      }
      .p-path {
        stroke: url(#pGradLight);
      }
      .x-path-1, .x-path-2 {
        stroke: url(#xGradLight);
      }
      .node-dot {
        fill: #003366;
      }
    }
  </style>

  <!-- Background Squircle com cantos arredondados -->
  <rect class="bg" x="2" y="2" width="60" height="60" rx="14" />

  <!-- Monograma Geométrico PX -->
  <!-- Letra P (Azul/Ciano) -->
  <path class="p-path" d="M 17 47 L 17 17 L 29 17 C 36 17 38 21 38 27 C 38 33 34 36 27 36 L 17 36" />

  <!-- Letra X (Vermelha com corte geométrico para profundidade) -->
  <path class="x-path-1" d="M 47 17 L 31 47" />
  <path class="x-path-2" d="M 33 21 L 47 47" />

  <!-- Ponto Vértice Tech / Nó de Grafo no topo -->
  <circle class="node-dot" cx="17" cy="17" r="2" />
</svg>
